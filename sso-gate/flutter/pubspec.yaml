name: sso_gate
description: >-
  Google sign-in gate + Admin allow-list UI for landry.bot Flutter web sites.
  Talks to sso-gate/server's HTTP contract (see ../README.md).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.4
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.0.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  google_sign_in_platform_interface: ^3.1.0
  plugin_platform_interface: ^2.1.8
